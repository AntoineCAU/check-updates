name: CI

on:
  # Pas sur les tags : ils pointent sur un commit déjà testé sur main, et les Mac de
  # GitHub sont parfois saturés (la tâche échoue alors après 15 min d'attente)
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  # Chaque lundi : détecte qu'une nouvelle version de macOS, de Homebrew ou d'un outil
  # a changé un format de sortie, avant que les utilisateurs ne le découvrent
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Un seul Mac à chaque push (moins d'exposition à la saturation des Mac de GitHub),
        # les deux versions de macOS chaque lundi et à la demande
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["macos-15", "macos-latest"]') || fromJSON('["macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          zsh -n bin/check-updates libexec/check-updates/sources/*.zsh libexec/check-updates/messages.zsh
          /usr/bin/python3 -I -m py_compile libexec/check-updates/helpers.py
          osacompile -o /tmp/picker.scpt libexec/check-updates/picker.applescript
          osacompile -o /tmp/dialog.scpt libexec/check-updates/dialog.applescript
          osacompile -o /tmp/notifier.app libexec/check-updates/notifier.applescript

      - name: Parsers (recorded outputs)
        run: tests/run.zsh

      - name: Doctor (real tools installed on the runner)
        run: bin/check-updates doctor

      - name: Full check
        run: |
          bin/check-updates --quiet
          cat ~/Library/Logs/check-updates/latest.md
